baseURL = "https://chancesmith.io/"
languageCode = "en-us"
title = "Chance Smith"
disableKinds = ["taxonomy", "term"]
ignoreFiles = ["^content/_drafts/", "^content/_ready/"]

[params]
  author = "Chance Smith"
  readingWPM = 200
  description = "What if management wasn't about controlling the work, but creating space for it? Exploring leadership that serves engineers instead of managing them."

  [params.social]
    twitter = "chance_smith"
    github = "chancesmith"

  [[params.commonSearches]]
    label = "Leadership"
    query = "leadership"
  [[params.commonSearches]]
    label = "Productivity"
    query = "productivity"
  [[params.commonSearches]]
    label = "Testing"
    query = "testing"
  [[params.commonSearches]]
    label = "Constraints"
    query = "constraint"
  [[params.commonSearches]]
    label = "Agile"
    query = "agile"
  [[params.commonSearches]]
    label = "Work Out Loud"
    query = "work out loud"
  [[params.commonSearches]]
    label = "Feature-Boxing"
    query = "feature-boxing"
  [[params.commonSearches]]
    label = "Async"
    query = "async"

[permalinks]
  blog = "/:contentbasename/"

[frontmatter]
  date = [":filename", ":fileModTime"]
  lastmod = [":git", ":fileModTime"]
  publishDate = []
  expiryDate = []

[services]
  [services.googleAnalytics]
    ID = "G-FD4ZXPSLB6"

[sitemap]
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "github"
